<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Viaje a España</title>
  <meta name="description" content="Planificador de viaje offline: itinerario, gastos, equipaje, lugares y diario." />
  <meta name="theme-color" content="#0b3d91" />
  <meta name="color-scheme" content="light dark" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Viaje" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="modulepreload" href="js/app.js" />
  <link rel="modulepreload" href="js/ui.js" />
  <link rel="modulepreload" href="js/store.js" />
  <link rel="modulepreload" href="js/settings.js" />
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/icons.js" />
  <link rel="modulepreload" href="js/sync.js" />
  <link rel="modulepreload" href="js/platform.js" />

  <link rel="stylesheet" href="css/styles.css" />
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('viaje.settings.v1') || '{}');
        if (s.theme === 'dark' || s.theme === 'light') {
          document.documentElement.setAttribute('data-theme', s.theme);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <header id="appbar" class="appbar"></header>
    <main id="view" class="view-host"></main>
    <nav id="tabbar" class="tabbar"></nav>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
